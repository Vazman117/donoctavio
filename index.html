<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Octavio – Proyecciones estadísticos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="home.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

<header>
  <div class="header-right">
    <img src="assets/logotipo.png" alt="Logo" class="header-logo" />
  </div>
  <div class="header-center">
    <span class="header-label">Proyecciones estadísticos</span>
  </div>
</header>

<main class="home-main">

  <!-- ── Mitad izquierda: imagen Don Octavio ── -->
  <section class="home-hero">
    <img src="assets/donoctavio.png" alt="Don Octavio" class="hero-img" />
    <p class="hero-tagline">El modelo detrás del partido</p>
  </section>

  <!-- ── Mitad derecha ── -->
  <section class="home-right">

    <!-- Fila superior: torneos -->
    <div class="torneos-grid">

      <a href="partidos.html" class="torneo-card">
        <img src="assets/futbol.png" alt="Liga MX" class="torneo-img" />
        <span class="badge">Activo</span>
      </a>

      <div class="torneo-card torneo-card--pronto">
        <img src="assets/mundial-2026.png" alt="Copa del Mundo 2026" class="torneo-img torneo-img--dim" />
        <span class="badge badge--pronto">Próximamente</span>
      </div>

    </div>

    <!-- Divisor -->
    <div class="home-divider"></div>

    <!-- Fila inferior: resumen de aciertos -->
    <div class="resumen-wrap">
      <p class="resumen-titulo">Últimas proyecciones</p>

      <!-- Métricas rápidas -->
      <div class="metricas-grid" id="metricas">
        <!-- llenado por historial.js -->
      </div>

      <!-- Mini tabla de últimos partidos -->
      <div class="mini-tabla" id="miniTabla">
        <!-- llenado por historial.js -->
      </div>

      <a href="historial.html" class="ver-todos-btn">Ver todas las proyecciones →</a>
    </div>

  </section>
</main>

<script src="historial.js"></script>

</body>
</html>
